# Build the iPhone app on a free GitHub macOS machine (no Mac needed): an unsigned LingoPrism.ipa to download from
# the run's "Artifacts", then install it from Windows with Sideloadly + a free Apple ID (see MOBILE/IOS.md).
# Free and unlimited for a public repository. Run: GitHub -> Actions -> "iOS build" -> Run workflow.
name: iOS build

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Server address"
        default: "https://lingoprism.id.vn"
  push:
    branches: [main]
    paths: ["MOBILE/**", ".github/workflows/ios.yml"]

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: MOBILE
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.8"  # same as the development machine
          channel: stable
          cache: true

      - run: flutter pub get

      - name: CocoaPods
        run: cd ios && pod install --repo-update

      - name: Build (no code signing: Sideloadly signs it with your Apple ID)
        run: >
          flutter build ios --release --no-codesign
          --dart-define=API_URL=${{ github.event.inputs.api_url || 'https://lingoprism.id.vn' }}

      - name: Pack .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry LingoPrism.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LingoPrism-ios
          path: MOBILE/LingoPrism.ipa
          retention-days: 30
