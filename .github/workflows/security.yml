# Security scans on every push / pull request, and weekly (new CVEs appear in libraries that did not change):
#   gitleaks   – secrets committed anywhere in the git history
#   bandit     – risky Python (Django backend)
#   semgrep    – Django / Python / React rules
#   pip-audit  – known vulnerabilities in backend libraries
#   npm audit  – known vulnerabilities in the web app's libraries
#   osv-scanner – known vulnerabilities in the Flutter app's packages (pubspec.lock)
#   trivy      – Dockerfile / compose misconfiguration
# The access-control and junk-input tests over every API route run with the other backend tests (backend.yml).
name: Security scans

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * 1"   # Monday 09:00 Vietnam time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --no-banner --redact --exit-code 1   # .gitleaks.toml: allowlist

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit semgrep
      - name: bandit (medium and high)
        run: bandit -q -r BE/apps BE/config -x "*/tests.py,*/test_*.py,*/migrations/*" -ll
      - name: semgrep
        run: semgrep scan --config p/django --config p/python --config p/react --metrics=off --error BE/apps BE/config FE/src
      - name: pip-audit
        # twisted (daphne's dependency): every open advisory is in a part daphne does not use (IMAP, IRC, telnet,
        # XMPP, DNS) or, for the HTTP one, is stopped by nginx in front. Drop each ignore once a release fixes it.
        run: >-
          pip-audit -r BE/requirements.txt --progress-spinner off
          --ignore-vuln CVE-2026-106454 --ignore-vuln CVE-2026-115778 --ignore-vuln CVE-2026-115774
          --ignore-vuln CVE-2026-115775 --ignore-vuln CVE-2026-115776 --ignore-vuln CVE-2026-115877
          --ignore-vuln CVE-2026-83813

  web-and-mobile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (web)
        working-directory: FE
        run: npm audit --omit=dev --audit-level=high
      - name: osv-scanner (web + Flutter packages)
        run: |
          curl -sSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner scan source -L MOBILE/pubspec.lock -L FE/package-lock.json

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: trivy config
        run: |
          curl -sSL https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz | tar xz trivy
          ./trivy config --quiet --severity HIGH,CRITICAL --ignorefile .trivyignore --exit-code 1 .
