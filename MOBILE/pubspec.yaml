name: lingoprism
description: LingoPrism – học từ vựng Việt · Anh · Trung bằng thị giác máy tính
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # GetX for state management
  get: ^4.6.6
  get_storage: ^2.1.1

  # Authentication (Google ID token is verified by the Django backend)
  google_sign_in: ^6.2.1

  # Realtime (Django Channels) & maps / location (GIS, geofencing)
  web_socket_channel: ^3.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1

  # Camera & Image Processing
  camera: ^0.10.5+7
  image_picker: ^1.0.5
  image: ^4.1.3
  path_provider: ^2.1.1

  # ML/AI On-device
  tflite_flutter: ^0.11.0
  # Using existing TFLite infrastructure instead of ONNX due to package availability

  # Networking
  dio: ^5.4.0
  dio_cache_interceptor: ^3.5.0
  connectivity_plus: ^5.0.2
  http: ^1.1.0

  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI Components
  flutter_native_splash: ^2.3.8
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^2.7.0
  flutter_svg: ^2.0.9
  cupertino_icons: ^1.0.8

  # Utils
  intl: ^0.20.2
  uuid: ^4.2.2
  permission_handler: ^11.1.0
  flutter_local_notifications: ^17.2.0
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  timezone: ^0.9.4

  # Audio
  just_audio: ^0.9.36
  audioplayers: ^5.2.1
  flutter_tts: ^4.0.2

  # Charts & Progress
  fl_chart: ^0.66.0
  percent_indicator: ^4.2.3

  # Responsive Design
  flutter_screenutil: ^5.9.0

  # Animations
  animations: ^2.0.8
  flutter_animate: ^4.3.0

  # Cards & Swipe
  flutter_card_swiper: ^7.0.0
  flutter_slidable: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  # hive_generator: ^2.0.1  # Temporarily disabled due to analyzer conflict
  flutter_launcher_icons: ^0.13.1
  analyzer: ^6.4.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  uses-material-design: true

  assets:
    # LingoPrism's own artwork (drawn by tool/brand_assets.py)
    - assets/brand/
    - assets/brand/mascot/
    - assets/brand/avatar/
    - assets/brand/icons/
    - assets/brand/rank/
    - assets/brand/group/
    - assets/icons/
    - assets/ml_models/
    - assets/models/  # ONNX models directory
    - assets/sounds/

  fonts:
    # Be Vietnam Pro – SIL Open Font License (assets/fonts/BeVietnamPro-OFL.txt), same font as the web
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-ExtraBold.ttf
          weight: 800
        # w900 in older screens falls back to ExtraBold
        - asset: assets/fonts/BeVietnamPro-ExtraBold.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/logo.png"
  image_path_ios: "assets/brand/logo_square.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#5B3BE8"
  adaptive_icon_foreground: "assets/brand/logo_foreground.png"
