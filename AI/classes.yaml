# Served by the pretrained models only (Open Images V7 folded + COCO), not in the training dataset: objects the
# vocabulary already has a word for. Without them a bouquet came out as broccoli/orange: the folded model had no
# "flower" to answer with and COCO picked the closest class it knows. oi = all Open Images classes for that word.
