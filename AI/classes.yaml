# LingoPrism – YOLOv10 classes ↔ vocabulary concepts (BE/seed/concepts/words.csv, column yolo_label)
#
# label:   class name used by the model and stored as Word.yolo_label
# slug:    vocabulary concept
# coco:    COCO-2017 category name (images taken from COCO)
# oi:      Open Images V7 class name (images taken from Open Images)
# A class may combine both sources.

