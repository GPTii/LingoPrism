# Production: serves the React build and proxies the Django API / WebSockets / media.
upstream django { server backend:8000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/        { proxy_pass http://django; include /etc/nginx/proxy_params.conf; }
    location /django-admin/ { proxy_pass http://django; include /etc/nginx/proxy_params.conf; }
    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        include /etc/nginx/proxy_params.conf;
    }
    location /static/ { alias /app/staticfiles/; expires 7d; }
    location /media/  { alias /app/media/; expires 7d; }

    # React router: every other path returns the SPA
    location / { try_files $uri /index.html; }
}
