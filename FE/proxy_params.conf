proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# overwrite, never append: a client-supplied X-Forwarded-For would let anyone pick the IP that rate limits count
# ($remote_addr is the visitor; behind Cloudflare the real_ip lines in nginx.conf make it so)
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
