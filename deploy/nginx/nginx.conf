# Production: serves the React build and proxies the Django API / WebSockets / media.
#
# Abuse protection happens here first (cheaper than in Python), Django's DRF throttles are the second layer:
#   * limit_req   – requests per second per client IP (API, login, photo detection)
#   * limit_conn  – simultaneous connections per IP (one machine cannot hold all workers)
#   * timeouts    – slow clients (slowloris) cannot keep connections open forever
#   * body size   – 12 MB photos at most
# Behind Cloudflare: limits must apply to the visitor, not to Cloudflare's IPs. CF-Connecting-IP is trusted only
# when the request really comes from Cloudflare (https://www.cloudflare.com/ips-v4 and ips-v6, fetched 2026-10-17),
# so a direct visitor cannot fake it.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Only Cloudflare may reach this server: someone going straight to the VM's IP would skip Cloudflare's DDoS shield.
# (ufw cannot do this: Docker publishes ports through its own iptables rules, past ufw.) Same list as above.
geo $realip_remote_addr $from_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

limit_req_zone  $binary_remote_addr zone=api:10m    rate=50r/s;   # per IP: a whole classroom can share one IP (school wifi)
limit_req_zone  $binary_remote_addr zone=auth:10m   rate=60r/m;
limit_req_zone  $binary_remote_addr zone=detect:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status  429;
limit_conn_status 429;

upstream django { server backend:8000; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# access log without the query string: WebSocket URLs carry the login token (?token=), links carry reset codes
log_format noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                   '$request_time "$http_user_agent"';

server {
    listen 80;
    listen 443 ssl;                    # Cloudflare "Full": self-signed origin cert in deploy/certs (made by deploy/deploy.sh)
    http2 on;
    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Mozilla "intermediate": forward secrecy + AEAD only (the default also accepted old CBC ciphers like AES128-SHA)
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    server_name lingoprism.id.vn www.lingoprism.id.vn;
    server_tokens off;                 # do not advertise the nginx version
    access_log /var/log/nginx/access.log noquery;

    client_max_body_size 12m;
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          30s;
    keepalive_timeout     30s;
    limit_conn perip 200;

    if ($from_cloudflare = 0) { return 444; }   # close the connection without an answer
    # HTTPS only: Cloudflare ("Full") comes in on the visitor's scheme, so a plain-http visit is sent to https
    if ($scheme = http) { return 301 https://$host$request_uri; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # browsers remember to use https for a year (only once HTTPS works everywhere: it cannot be taken back quickly)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=()" always;
    # React build: own scripts only; antd injects styles; images also come from word sources and map tiles (https)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' ws: wss: https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/v1/auth/   { limit_req zone=auth burst=40 nodelay;  proxy_pass http://django; include /etc/nginx/proxy_params.conf; }
    location = /api/v1/detect/ { limit_req zone=detect burst=40 nodelay; proxy_pass http://django; include /etc/nginx/proxy_params.conf;
                                 proxy_read_timeout 60s; }
    location /api/           { limit_req zone=api burst=200 nodelay;  proxy_pass http://django; include /etc/nginx/proxy_params.conf;
                               proxy_read_timeout 60s; }
    location /django-admin/  { limit_req zone=auth burst=10 nodelay;  proxy_pass http://django; include /etc/nginx/proxy_params.conf; }
    location /ws/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        include /etc/nginx/proxy_params.conf;
    }
    # Vite build files carry a content hash in their name: a new build gets new names, so they can be cached for good
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;   # a location with its own add_header drops the server-level ones
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
        try_files $uri =404;
    }
    location /static/ { alias /app/staticfiles/; expires 7d; access_log off; }
    location /media/  {
        alias /app/media/;
        expires 7d;
        autoindex off;
        # uploads are images only: never let a file be interpreted as a page or script
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; sandbox" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location ~ /\. { deny all; }       # .env, .git … if ever copied into the web root

    # React router: every other path returns the SPA
    location / { try_files $uri /index.html; }
}
